name: Deploy LinkedIn API - NonProd

on:
  push:
    branches:
      - non-prod

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: us-east-1
      IMAGE_REPO_NAME: uwwlinkedin-nonprod
      IMAGE_TAG: latest
      ECR_REPOSITORY_URI: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/uwwlinkedin-nonprod
      ECS_CONTAINER_NAME: uwwnonprod-linkedin-container
      ECS_SERVICE_NAME: uwwnonprod-linkedin-taskdef-service-wosgt2eo
      ECS_CLUSTER_NAME: uwwnonprod-linkedin-ecs

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build Docker image
        run: docker build -t $IMAGE_REPO_NAME:$IMAGE_TAG .

      - name: Tag and push image
        id: build-image
        run: |
          docker tag $IMAGE_REPO_NAME:$IMAGE_TAG $ECR_REPOSITORY_URI:$IMAGE_TAG
          docker push $ECR_REPOSITORY_URI:$IMAGE_TAG
          echo "image=$ECR_REPOSITORY_URI:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: uwwnonprod-linkedin-taskdef
          service: ${{ env.ECS_SERVICE_NAME }}
          cluster: ${{ env.ECS_CLUSTER_NAME }}
          image: ${{ steps.build-image.outputs.image }}
          wait-for-service-stability: true